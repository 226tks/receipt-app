<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>レジ締めOCR</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:        #ffffff;
    --surface-2: #f5f5f5;
    --line:      #d4d4d4;
    --ink:       #0a0a0a;
    --ink-2:     #404040;
    --ink-dim:   #737373;
    --warn:      #b45309;
    --warn-bg:   #fef3c7;
    --warn-line: #f59e0b;
    --ok-bg:     #ecfdf5;
    --ok-line:   #10b981;
    --ok:        #065f46;
    --sans: -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic UI', 'Yu Gothic', system-ui, sans-serif;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    --radius: 4px;
    --tap:    48px;
  }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
  }
  .topbar {
    padding: 14px 20px;
    border-bottom: 2px solid var(--ink);
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    background: var(--bg);
    position: sticky; top: 0; z-index: 10;
  }
  .topbar h1 { font-size: 17px; font-weight: 700; }
  .status {
    font-size: 13px; font-weight: 600;
    padding: 6px 12px;
    border: 1.5px solid var(--ink);
    border-radius: var(--radius);
    white-space: nowrap; min-width: 92px; text-align: center;
  }
  .status.scanning { background: var(--ink); color: #fff; animation: pulse 1.2s ease-in-out infinite; }
  .status.done     { background: var(--ink); color: #fff; }
  @keyframes pulse { 0%,100% {opacity:1;} 50% {opacity:0.6;} }
  .cam-wrap {
    position: relative; background: #000;
    aspect-ratio: 4 / 3; overflow: hidden;
    border-bottom: 1px solid var(--line);
  }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .no-cam-msg {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-2); background: var(--surface-2);
    font-size: 15px; padding: 24px; text-align: center; line-height: 1.6;
  }
  .guides { position: absolute; inset: 0; pointer-events: none; }
  .guides svg { width: 100%; height: 100%; }
  .actions {
    padding: 16px 20px 8px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  }
  .btn {
    min-height: var(--tap);
    padding: 12px 16px;
    border: 1.5px solid var(--ink);
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px; font-weight: 600;
    border-radius: var(--radius);
    cursor: pointer;
    transition: transform 0.05s ease, background-color 0.15s ease;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .btn.primary { background: var(--ink); color: #fff; }
  .btn.primary:active { background: #2a2a2a; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .note {
    padding: 8px 20px 12px;
    color: var(--ink-2); font-size: 13px; line-height: 1.6;
  }
  .registers {
    padding: 0 20px 12px;
    display: grid; gap: 14px;
  }
  .register {
    background: var(--bg);
    border: 1.5px solid var(--ink);
    border-radius: var(--radius);
    padding: 18px;
  }
  .register h2 {
    font-size: 15px; font-weight: 700;
    margin-bottom: 14px;
    display: flex; align-items: center; gap: 10px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
  }
  .register h2 .num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px;
    background: var(--ink); color: #fff;
    border-radius: 2px;
    font-family: var(--mono); font-size: 13px; font-weight: 700;
  }
  .register h2 .check {
    margin-left: auto;
    font-size: 12px; font-weight: 600;
    padding: 3px 8px;
    border-radius: 2px;
  }
  .register h2 .check.ok   { background: var(--ok-bg);   color: var(--ok);   border: 1px solid var(--ok-line); }
  .register h2 .check.warn { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-line); }
  .register h2 .check[hidden] { display: none; }
  .field {
    display: grid; grid-template-columns: 90px 1fr;
    align-items: center; gap: 12px;
    margin-bottom: 10px;
  }
  .field:last-child { margin-bottom: 0; }
  .field label { font-size: 15px; font-weight: 500; color: var(--ink-2); }
  .field input {
    background: var(--bg);
    border: 1.5px solid var(--line);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 18px; font-weight: 600;
    padding: 12px 14px;
    border-radius: var(--radius);
    text-align: right; width: 100%;
    -moz-appearance: textfield;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .field input::-webkit-outer-spin-button,
  .field input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .field input:focus {
    outline: none;
    border-color: var(--ink);
    box-shadow: 0 0 0 3px rgba(0,0,0,0.08);
  }
  .field input.auto { background: var(--surface-2); border-color: var(--ink); }
  .warning {
    margin: 0 20px 16px;
    padding: 12px 14px;
    background: var(--warn-bg);
    border: 1.5px solid var(--warn-line);
    border-radius: var(--radius);
    color: var(--warn);
    font-size: 13px; font-weight: 600; line-height: 1.5;
  }
  .warning[hidden] { display: none; }
  .sum {
    background: var(--ink); color: #fff;
    margin: 0 20px 16px;
    border-radius: var(--radius);
    padding: 20px;
  }
  .sum h2 {
    font-size: 13px; font-weight: 700;
    letter-spacing: 0.2em;
    margin-bottom: 14px;
    text-transform: uppercase;
    opacity: 0.7;
  }
  .sum-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.15);
  }
  .sum-row:last-child { border-bottom: none; }
  .sum-row .label { font-size: 15px; color: rgba(255,255,255,0.75); font-weight: 500; }
  .sum-row .val   { font-family: var(--mono); font-size: 20px; font-weight: 700; }
  .sum-row.highlight {
    margin-top: 6px; padding-top: 14px;
    border-top: 2px solid rgba(255,255,255,0.4);
  }
  .sum-row.highlight .label { color: #fff; font-size: 16px; font-weight: 700; }
  .sum-row.highlight .val { font-size: 28px; }
  .record-bar {
    padding: 0 20px 16px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  }
  .reset-bar {
    padding: 0 20px 32px;
    display: flex; justify-content: center;
  }
  .btn-text {
    background: none; border: none;
    color: var(--ink-2);
    font-size: 14px;
    font-family: var(--sans);
    padding: 12px 16px;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 4px;
  }
  .btn-text:focus-visible {
    outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 2px;
  }
  .modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    display: none; align-items: flex-end;
    z-index: 50;
  }
  .modal.on { display: flex; }
  .modal-panel {
    width: 100%;
    max-height: 85vh;
    background: var(--bg);
    border-top-left-radius: 12px; border-top-right-radius: 12px;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  @media (min-width: 640px) {
    .modal { align-items: center; justify-content: center; }
    .modal-panel { max-width: 640px; border-radius: 12px; max-height: 80vh; }
  }
  .modal-head {
    padding: 16px 20px;
    border-bottom: 2px solid var(--ink);
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal-head h2 { font-size: 17px; font-weight: 700; }
  .modal-close {
    background: none; border: none;
    font-size: 24px; cursor: pointer; padding: 4px 8px;
    color: var(--ink);
  }
  .history-list {
    overflow-y: auto; flex: 1;
    padding: 8px 0;
  }
  .history-empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--ink-dim);
    font-size: 14px;
  }
  .history-item {
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px;
  }
  .history-item .date { flex: 1; font-size: 14px; font-weight: 600; }
  .history-item .date .sub {
    font-size: 12px; color: var(--ink-dim); font-weight: 400; margin-top: 2px;
  }
  .history-item .amount {
    font-family: var(--mono); font-size: 16px; font-weight: 700;
  }
  .history-item .del {
    background: none;
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 6px 10px; font-size: 12px;
    cursor: pointer;
    color: var(--ink-2);
  }
  .modal-foot {
    padding: 12px 20px;
    border-top: 1px solid var(--line);
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    background: var(--surface-2);
  }
  .loading {
    position: fixed; inset: 0;
    background: rgba(255,255,255,0.92);
    display: none; align-items: center; justify-content: center;
    z-index: 100;
    backdrop-filter: blur(2px);
  }
  .loading.on { display: flex; }
  .loading-inner { text-align: center; padding: 24px; }
  .spinner {
    width: 44px; height: 44px;
    border: 3px solid var(--line);
    border-top-color: var(--ink);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-msg { font-size: 14px; font-weight: 600; color: var(--ink); }
  .toast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--ink); color: #fff;
    padding: 12px 20px;
    border-radius: 4px;
    font-size: 14px; font-weight: 600;
    z-index: 200;
    opacity: 0;
    transition: transform 0.25s ease, opacity 0.25s ease;
    pointer-events: none;
    max-width: 90vw; text-align: center;
  }
  .toast.on {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
  input[type=file] { display: none; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<header class="topbar">
  <h1>レジ締めOCR</h1>
  <div class="status" id="status" role="status" aria-live="polite">準備中</div>
</header>
<div class="cam-wrap" id="camwrap">
  <video id="video" autoplay playsinline muted aria-label="カメラ映像"></video>
  <div class="guides" aria-hidden="true">
    <svg viewBox="0 0 100 75" preserveAspectRatio="none">
      <rect x="3"  y="3" width="45" height="69" fill="none" stroke="#fff" stroke-width="0.5" stroke-dasharray="2 1.2" opacity="0.9"/>
      <rect x="52" y="3" width="45" height="69" fill="none" stroke="#fff" stroke-width="0.5" stroke-dasharray="2 1.2" opacity="0.9"/>
      <text x="25.5" y="40" text-anchor="middle" fill="#fff" font-size="3.5" opacity="0.85" font-weight="700">1レジ</text>
      <text x="74.5" y="40" text-anchor="middle" fill="#fff" font-size="3.5" opacity="0.85" font-weight="700">2レジ</text>
    </svg>
  </div>
</div>
<div class="actions">
  <button class="btn primary" id="captureBtn" type="button">
    <span aria-hidden="true">●</span><span>今すぐ撮影</span>
  </button>
  <button class="btn" id="uploadBtn" type="button">
    <span aria-hidden="true">▤</span><span>画像から読み取り</span>
  </button>
  <input type="file" id="fileInput" accept="image/*">
</div>
<p class="note">2枚のレシートを間に隙間を空けて並べ、枠に収まるよう撮影してください。読み取った値は各欄をタップして修正できます。</p>
<section class="registers" aria-label="読み取り結果">
  <div class="register">
    <h2>
      <span class="num">1</span> 1レジ
      <span class="check" id="check-1" hidden></span>
    </h2>
    <div class="field"><label for="r1-rcount">レシ数</label><input id="r1-rcount" type="number" inputmode="numeric" data-r="1" data-k="rcount"></div>
    <div class="field"><label for="r1-total">総売上</label><input id="r1-total"  type="number" inputmode="numeric" data-r="1" data-k="total"></div>
    <div class="field"><label for="r1-tax">消費税</label><input id="r1-tax"    type="number" inputmode="numeric" data-r="1" data-k="tax"></div>
    <div class="field"><label for="r1-net">純売上</label><input id="r1-net"    type="number" inputmode="numeric" data-r="1" data-k="net"></div>
  </div>
  <div class="register">
    <h2>
      <span class="num">2</span> 2レジ
      <span class="check" id="check-2" hidden></span>
    </h2>
    <div class="field"><label for="r2-rcount">レシ数</label><input id="r2-rcount" type="number" inputmode="numeric" data-r="2" data-k="rcount"></div>
    <div class="field"><label for="r2-total">総売上</label><input id="r2-total"  type="number" inputmode="numeric" data-r="2" data-k="total"></div>
    <div class="field"><label for="r2-tax">消費税</label><input id="r2-tax"    type="number" inputmode="numeric" data-r="2" data-k="tax"></div>
    <div class="field"><label for="r2-net">純売上</label><input id="r2-net"    type="number" inputmode="numeric" data-r="2" data-k="net"></div>
  </div>
</section>
<div class="warning" id="warning" hidden role="alert"></div>
<section class="sum" aria-label="合計">
  <h2>合計</h2>
  <div class="sum-row"><span class="label">レシ数</span><span class="val" id="sumC">0</span></div>
  <div class="sum-row"><span class="label">総売上</span><span class="val" id="sumT">¥0</span></div>
  <div class="sum-row"><span class="label">消費税</span><span class="val" id="sumTax">¥0</span></div>
  <div class="sum-row highlight"><span class="label">純売上合計</span><span class="val" id="sumN">¥0</span></div>
</section>
<div class="record-bar">
  <button class="btn primary" id="saveBtn" type="button">📝 履歴に保存</button>
  <button class="btn" id="historyBtn" type="button">📂 履歴を見る</button>
</div>
<div class="reset-bar">
  <button class="btn-text" id="resetBtn" type="button">すべての値をクリア</button>
</div>
<div class="modal" id="historyModal" role="dialog" aria-modal="true" aria-labelledby="history-title">
  <div class="modal-panel">
    <div class="modal-head">
      <h2 id="history-title">履歴</h2>
      <button class="modal-close" id="historyClose" aria-label="閉じる">×</button>
    </div>
    <div class="history-list" id="historyList"></div>
    <div class="modal-foot">
      <button class="btn" id="exportBtn" type="button">📥 CSVをダウンロード</button>
      <button class="btn" id="clearHistoryBtn" type="button">履歴をすべて削除</button>
    </div>
  </div>
</div>
<div class="loading" id="loading" role="alert" aria-live="assertive">
  <div class="loading-inner">
    <div class="spinner" aria-hidden="true"></div>
    <div class="loading-msg" id="loadingMsg">読み取り中</div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const video = $('video');
const statusEl = $('status');
const loading = $('loading');
const loadingMsg = $('loadingMsg');
const warningEl = $('warning');
const toastEl = $('toast');
const captureBtn = $('captureBtn');
let stream = null;
let isProcessing = false;
let isFrozen = false;  // 撮影完了後、カメラ映像をフリーズ中か
const STORAGE_KEY = 'register-ocr-history-v1';
function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = 'status' + (cls ? ' ' + cls : '');
}
function showLoading(msg) {
  loadingMsg.textContent = msg || '読み取り中';
  loading.classList.add('on');
}
function hideLoading() { loading.classList.remove('on'); }
let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('on'), 2200);
}
/** 撮影ボタンの見た目を「撮影」/「再撮影」で切り替える */
function setCaptureButtonMode(mode) {
  if (mode === 'retake') {
    captureBtn.innerHTML = '<span aria-hidden="true">🔄</span><span>再撮影</span>';
  } else {
    captureBtn.innerHTML = '<span aria-hidden="true">●</span><span>今すぐ撮影</span>';
  }
}
let workerPromise = null;
function getWorker() {
  if (!workerPromise) {
    workerPromise = (async () => {
      const w = await Tesseract.createWorker(['jpn', 'eng']);
      // レジ集計欄は「一様な1ブロックのテキスト」。PSM 6 を指定すると
      // 疎なレシートでの誤った領域分割が減り、数字の読み取りが安定する。
      await w.setParameters({
        tessedit_pageseg_mode: '6',        // PSM 6: single uniform block
        preserve_interword_spaces: '1'     // 桁区切りの空白を保持
      });
      return w;
    })();
  }
  return workerPromise;
}
async function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showCamFallback('お使いのブラウザではカメラが使えません。画像アップロードをご利用ください。');
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width:  { ideal: 1920 },
        height: { ideal: 1440 }
      },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    setStatus('構えてください');
    isFrozen = false;
  } catch (e) {
    console.error(e);
    let msg = 'カメラを使えません。';
    if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
      msg += ' HTTPS環境でアクセスしてください。';
    } else {
      msg += ' 設定でカメラを許可するか、画像アップロードをご利用ください。';
    }
    showCamFallback(msg);
  }
}
/** カメラ映像を止める(撮影した瞬間の画面が表示されたままになる) */
function freezeCamera() {
  video.pause();
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  isFrozen = true;
}
/** 再撮影 - カメラを再起動 */
async function retakePhoto() {
  // 入力欄をクリアして再撮影に備える
  document.querySelectorAll('input[type=number]').forEach(el => {
    el.value = '';
    el.classList.remove('auto');
  });
  recalc();
  validate();
  setCaptureButtonMode('capture');
  await startCamera();
}
function showCamFallback(msg) {
  setStatus('カメラ不可');
  const wrap = $('camwrap');
  const fallback = document.createElement('div');
  fallback.className = 'no-cam-msg';
  fallback.textContent = msg;
  wrap.appendChild(fallback);
}
async function captureFromVideo() {
  if (isProcessing || !video.videoWidth) return;
  isProcessing = true;
  setStatus('読み取り中', 'scanning');
  showLoading('画像を読み取り中…');
  const c = document.createElement('canvas');
  c.width = video.videoWidth;
  c.height = video.videoHeight;
  c.getContext('2d').drawImage(video, 0, 0);
  // 撮影が終わったらカメラをフリーズして「再撮影」モードに切り替え
  freezeCamera();
  setCaptureButtonMode('retake');
  try {
    await processCanvas(c);
    setStatus('完了 / 修正可', 'done');
    if (navigator.vibrate) navigator.vibrate(40);
  } catch (e) {
    console.error(e);
    setStatus('失敗');
    toast('読み取りに失敗しました');
  } finally {
    hideLoading();
    isProcessing = false;
  }
}
async function captureFromFile(file) {
  if (isProcessing) return;
  isProcessing = true;
  showLoading('画像を読み取り中…');
  setStatus('読み取り中', 'scanning');
  // ファイル選択時は、現在動いているカメラを止めて読み取った画像を表示する
  freezeCamera();
  setCaptureButtonMode('retake');
  try {
    const img = await loadImage(file);
    const c = document.createElement('canvas');
    c.width = img.width;
    c.height = img.height;
    c.getContext('2d').drawImage(img, 0, 0);
    await processCanvas(c);
    setStatus('完了 / 修正可', 'done');
  } catch (e) {
    console.error(e);
    setStatus('失敗');
    toast('読み取りに失敗しました');
  } finally {
    hideLoading();
    isProcessing = false;
  }
}
function loadImage(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => {
      const i = new Image();
      i.onload = () => resolve(i);
      i.onerror = reject;
      i.src = r.result;
    };
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
function findReceiptGap(canvas) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const img = ctx.getImageData(0, 0, w, h);
  const d = img.data;
  const DARK = 110;
  const colDark = new Array(w).fill(0);
  for (let y = 0; y < h; y += 3) {
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      const v = (d[i] + d[i+1] + d[i+2]) / 3;
      if (v < DARK) colDark[x]++;
    }
  }
  const window = Math.max(10, Math.floor(w / 50));
  const smoothed = new Array(w);
  for (let x = 0; x < w; x++) {
    let sum = 0, cnt = 0;
    for (let i = Math.max(0, x - window); i <= Math.min(w - 1, x + window); i++) {
      sum += colDark[i]; cnt++;
    }
    smoothed[x] = sum / cnt;
  }
  const start = Math.floor(w * 0.30);
  const end   = Math.floor(w * 0.70);
  let minDark = Infinity, minX = Math.floor(w / 2);
  for (let x = start; x < end; x++) {
    if (smoothed[x] < minDark) { minDark = smoothed[x]; minX = x; }
  }
  let avgDark = 0;
  for (let x = start; x < end; x++) avgDark += smoothed[x];
  avgDark /= (end - start);
  if (avgDark > 1 && minDark < avgDark * 0.4) return minX;
  return Math.floor(w / 2);
}
async function processCanvas(canvas) {
  const w = canvas.width, h = canvas.height;
  const gapX = findReceiptGap(canvas);
  console.log('Gap detected at x =', gapX, '/', w);
  const left  = sliceCanvas(canvas, 0,    0, gapX,     h);
  const right = sliceCanvas(canvas, gapX, 0, w - gapX, h);

  loadingMsg.textContent = '1レジを読み取り中…';
  const f1 = await ocrReceipt(left);
  loadingMsg.textContent = '2レジを読み取り中…';
  const f2 = await ocrReceipt(right);

  fillFields(1, f1);
  fillFields(2, f2);
  recalc();
  validate();
}
/**
 * 各レシートを読み取る。必要な項目(総売上・純売上・消費税)は
 * レシート最上部の[売上内訳]欄に集中しているため、まず上部だけを
 * 高速に読み取る。取りこぼしがあればレシート全体で読み直す。
 * → 通常は処理面積が小さく高速、かつ下部の明細による誤検出も避けられる。
 */
async function ocrReceipt(slice) {
  const top = sliceCanvas(slice, 0, 0, slice.width, Math.floor(slice.height * 0.62));
  let fields = await ocrOne(top);
  const enough = fields.total && (fields.net || fields.tax);
  if (!enough) {
    console.log('上部パスで不足 → 全体で読み直し');
    fields = await ocrOne(slice);
  }
  return fields;
}
async function ocrOne(srcCanvas) {
  let c = srcCanvas;
  // 先に拡大 → その後に二値化する(順序が逆だと文字の輪郭がギザギザになり精度が落ちる)
  if (c.width < 1500) {
    const factor = Math.min(3, Math.max(1.2, 1500 / c.width));
    c = upscale(c, factor);
  }
  adaptiveBinarize(c);
  const worker = await getWorker();
  const r = await worker.recognize(c);
  console.log('--- OCR ---\n' + r.data.text);
  return extractFields(r.data.text);
}
function sliceCanvas(src, sx, sy, sw, sh) {
  const c = document.createElement('canvas');
  c.width = sw; c.height = sh;
  c.getContext('2d').drawImage(src, sx, sy, sw, sh, 0, 0, sw, sh);
  return c;
}
function upscale(canvas, factor) {
  const out = document.createElement('canvas');
  out.width = Math.round(canvas.width * factor);
  out.height = Math.round(canvas.height * factor);
  const ctx = out.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(canvas, 0, 0, out.width, out.height);
  return out;
}
/**
 * Bradley 適応的二値化。
 * 各画素の閾値を「その周辺の局所平均」から決めるため、感熱紙にありがちな
 * 照明ムラ・影・左右の濃淡差に強い。積分画像を使うので O(W×H) で高速。
 * (従来のグローバル閾値 mean*0.86 の置き換え)
 */
function adaptiveBinarize(canvas) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const img = ctx.getImageData(0, 0, W, H);
  const d = img.data;
  const gray = new Float64Array(W * H);
  for (let i = 0, j = 0; i < d.length; i += 4, j++) {
    gray[j] = (d[i] + d[i+1] + d[i+2]) / 3;
  }
  // 積分画像(左上からの累積和)
  const integral = new Float64Array(W * H);
  for (let y = 0; y < H; y++) {
    let rowSum = 0;
    for (let x = 0; x < W; x++) {
      rowSum += gray[y*W + x];
      integral[y*W + x] = (y > 0 ? integral[(y-1)*W + x] : 0) + rowSum;
    }
  }
  const half = Math.max(10, Math.floor(W / 16)); // 局所窓の半径
  const k = 0.15;                                 // 平均より15%暗ければ文字
  for (let y = 0; y < H; y++) {
    const y1 = Math.max(0, y - half), y2 = Math.min(H - 1, y + half);
    for (let x = 0; x < W; x++) {
      const x1 = Math.max(0, x - half), x2 = Math.min(W - 1, x + half);
      const count = (x2 - x1 + 1) * (y2 - y1 + 1);
      const A = (x1 > 0 && y1 > 0) ? integral[(y1-1)*W + (x1-1)] : 0;
      const B = (y1 > 0) ? integral[(y1-1)*W + x2] : 0;
      const C = (x1 > 0) ? integral[y2*W + (x1-1)] : 0;
      const D = integral[y2*W + x2];
      const sum = D - B - C + A;
      const j = y*W + x;
      const v = (gray[j] * count <= sum * (1 - k)) ? 0 : 255;
      const i = j * 4;
      d[i] = d[i+1] = d[i+2] = v;
    }
  }
  ctx.putImageData(img, 0, 0);
}
function normalize(s) {
  let result = s
    .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[，、]/g, ',')
    .replace(/[Ｙ￥]/g, '¥');
  let prev;
  do {
    prev = result;
    result = result.replace(/(\d{1,3})[\s.,'`‘’](\d{3})(?!\d)/g, '$1,$2');
  } while (result !== prev);
  return result;
}
function yenAmount(line) {
  const matches = [...line.matchAll(/[¥Y]\s*((?:\d+[ .,'`‘’]?)+\d*)/g)];
  if (matches.length > 0) {
    let max = 0;
    for (const m of matches) {
      const digitsOnly = m[1].replace(/\D/g, '');
      if (digitsOnly) {
        const n = parseInt(digitsOnly, 10);
        if (n > max) max = n;
      }
    }
    if (max > 0) return max.toString();
  }
  const cleaned = line.replace(/,/g, '');
  const nums = (cleaned.match(/\d+/g) || []).map(Number).filter(n => n >= 100);
  if (!nums.length) return '';
  return Math.max(...nums).toString();
}
function extractFields(text) {
  const allLines = normalize(text).split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const lines = allLines.slice(0, 18);
  const result = { rcount: '', total: '', tax: '', net: '' };
  for (const line of lines) {
    if (!result.rcount) {
      const m = line.replace(/,/g, '').match(/(\d+)\s*枚/);
      if (m) result.rcount = m[1];
    }
    if (!result.net && /純/.test(line)) {
      const v = yenAmount(line);
      if (v) result.net = v;
    }
    if (!result.tax && /(消費|費税)/.test(line)) {
      const v = yenAmount(line);
      if (v) result.tax = v;
    }
    if (!result.total && /総/.test(line) && !/純/.test(line)) {
      const v = yenAmount(line);
      if (v) result.total = v;
    }
  }
  return result;
}
function fillFields(register, vals) {
  for (const key of ['rcount', 'total', 'tax', 'net']) {
    const el = document.querySelector(`input[data-r="${register}"][data-k="${key}"]`);
    if (!el) continue;
    if (vals[key]) {
      el.value = vals[key];
      el.classList.add('auto');
    }
  }
}
function getVal(r, k) {
  const el = document.querySelector(`input[data-r="${r}"][data-k="${k}"]`);
  return parseFloat(el.value) || 0;
}
function recalc() {
  const sums = {
    rcount: getVal(1,'rcount') + getVal(2,'rcount'),
    total:  getVal(1,'total')  + getVal(2,'total'),
    tax:    getVal(1,'tax')    + getVal(2,'tax'),
    net:    getVal(1,'net')    + getVal(2,'net'),
  };
  const yen = n => '¥' + Math.round(n).toLocaleString();
  $('sumC').textContent   = sums.rcount.toLocaleString();
  $('sumT').textContent   = yen(sums.total);
  $('sumTax').textContent = yen(sums.tax);
  $('sumN').textContent   = yen(sums.net);
}
function validate() {
  const messages = [];
  for (const r of [1, 2]) {
    const total = getVal(r, 'total');
    const tax   = getVal(r, 'tax');
    const net   = getVal(r, 'net');
    const checkEl = $('check-' + r);
    if (total === 0 && tax === 0 && net === 0) {
      checkEl.hidden = true;
      continue;
    }
    if (total === 0 || (tax === 0 && net === 0)) {
      checkEl.hidden = true;
      continue;
    }
    const diff = Math.abs(total - tax - net);
    if (diff <= 5) {
      checkEl.textContent = '✓ 検算OK';
      checkEl.className = 'check ok';
      checkEl.hidden = false;
    } else {
      checkEl.textContent = '⚠ 検算NG';
      checkEl.className = 'check warn';
      checkEl.hidden = false;
      messages.push(
        `${r}レジ: 純売上+消費税=${(net+tax).toLocaleString()} が 総売上=${total.toLocaleString()} と一致しません(差${diff.toLocaleString()})`
      );
    }
  }
  if (messages.length > 0) {
    warningEl.innerHTML = messages.map(m => '⚠ ' + m).join('<br>') +
      '<br><span style="font-weight:500;opacity:0.85">OCRの読み違いの可能性があります。数値をご確認ください。</span>';
    warningEl.hidden = false;
  } else {
    warningEl.hidden = true;
  }
}
document.querySelectorAll('input[type=number]').forEach(el => {
  el.addEventListener('input', () => {
    el.classList.remove('auto');
    recalc();
    validate();
  });
});
captureBtn.addEventListener('click', () => {
  if (isProcessing) return;
  if (isFrozen) {
    // 再撮影モード: カメラ再起動
    retakePhoto();
  } else if (video.srcObject) {
    // 撮影モード: 撮影実行
    captureFromVideo();
  } else {
    // カメラが使えない場合はファイル選択にフォールバック
    $('fileInput').click();
  }
});
$('uploadBtn').addEventListener('click', () => $('fileInput').click());
$('fileInput').addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) captureFromFile(f);
  e.target.value = '';
});
$('resetBtn').addEventListener('click', () => {
  if (!confirm('すべての入力値をクリアします。よろしいですか？')) return;
  document.querySelectorAll('input[type=number]').forEach(el => {
    el.value = '';
    el.classList.remove('auto');
  });
  recalc();
  validate();
  setStatus('構えてください');
});
function loadHistory() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch { return []; }
}
function saveHistory(arr) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
}
function currentEntry() {
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth() + 1).padStart(2, '0');
  const dd = String(today.getDate()).padStart(2, '0');
  const hh = String(today.getHours()).padStart(2, '0');
  const mi = String(today.getMinutes()).padStart(2, '0');
  return {
    id: Date.now().toString(),
    date: `${yyyy}-${mm}-${dd}`,
    time: `${hh}:${mi}`,
    r1: { rcount: getVal(1,'rcount'), total: getVal(1,'total'), tax: getVal(1,'tax'), net: getVal(1,'net') },
    r2: { rcount: getVal(2,'rcount'), total: getVal(2,'total'), tax: getVal(2,'tax'), net: getVal(2,'net') }
  };
}
$('saveBtn').addEventListener('click', () => {
  const entry = currentEntry();
  const hasData =
    entry.r1.total || entry.r1.net || entry.r1.rcount ||
    entry.r2.total || entry.r2.net || entry.r2.rcount;
  if (!hasData) {
    toast('保存する値がありません');
    return;
  }
  const hist = loadHistory();
  hist.unshift(entry);
  if (hist.length > 365) hist.length = 365;
  saveHistory(hist);
  toast('履歴に保存しました');
});
const historyModal = $('historyModal');
function renderHistory() {
  const list = $('historyList');
  const hist = loadHistory();
  if (hist.length === 0) {
    list.innerHTML = '<div class="history-empty">まだ保存された履歴はありません</div>';
    return;
  }
  list.innerHTML = '';
  for (const entry of hist) {
    const total = (entry.r1.total||0) + (entry.r2.total||0);
    const net   = (entry.r1.net||0)   + (entry.r2.net||0);
    const item = document.createElement('div');
    item.className = 'history-item';
    item.innerHTML = `
      <div class="date">
        ${entry.date} ${entry.time || ''}
        <div class="sub">純売上 ¥${net.toLocaleString()}</div>
      </div>
      <div class="amount">¥${total.toLocaleString()}</div>
      <button class="del" data-id="${entry.id}">削除</button>
    `;
    list.appendChild(item);
  }
  list.querySelectorAll('.del').forEach(btn => {
    btn.addEventListener('click', e => {
      const id = e.currentTarget.dataset.id;
      if (!confirm('この履歴を削除しますか？')) return;
      const next = loadHistory().filter(x => x.id !== id);
      saveHistory(next);
      renderHistory();
      toast('削除しました');
    });
  });
}
$('historyBtn').addEventListener('click', () => {
  renderHistory();
  historyModal.classList.add('on');
});
$('historyClose').addEventListener('click', () => historyModal.classList.remove('on'));
historyModal.addEventListener('click', e => {
  if (e.target === historyModal) historyModal.classList.remove('on');
});
$('clearHistoryBtn').addEventListener('click', () => {
  if (!confirm('すべての履歴を削除します。元に戻せません。よろしいですか？')) return;
  saveHistory([]);
  renderHistory();
  toast('履歴をすべて削除しました');
});
$('exportBtn').addEventListener('click', () => {
  const hist = loadHistory();
  if (hist.length === 0) {
    toast('履歴がありません');
    return;
  }
  const header = [
    '日付','時刻',
    '1レジ レシ数','1レジ 総売上','1レジ 消費税','1レジ 純売上',
    '2レジ レシ数','2レジ 総売上','2レジ 消費税','2レジ 純売上',
    '合計 レシ数','合計 総売上','合計 消費税','合計 純売上'
  ];
  const rows = [header];
  const sorted = [...hist].sort((a,b) => (a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
  for (const e of sorted) {
    const sumC = (e.r1.rcount||0) + (e.r2.rcount||0);
    const sumT = (e.r1.total||0)  + (e.r2.total||0);
    const sumTax = (e.r1.tax||0)  + (e.r2.tax||0);
    const sumN = (e.r1.net||0)    + (e.r2.net||0);
    rows.push([
      e.date, e.time || '',
      e.r1.rcount||0, e.r1.total||0, e.r1.tax||0, e.r1.net||0,
      e.r2.rcount||0, e.r2.total||0, e.r2.tax||0, e.r2.net||0,
      sumC, sumT, sumTax, sumN
    ]);
  }
  const csv = '﻿' + rows.map(r => r.map(cell => {
    const s = String(cell);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const stamp = new Date().toISOString().slice(0,10).replace(/-/g,'');
  a.download = `register-ocr-${stamp}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('CSVをダウンロードしました');
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    // ページが隠れたらカメラを止める
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
  } else if (!document.hidden && !stream && !isFrozen) {
    // ページに戻ってきて、撮影完了状態でなければカメラ再開
    startCamera();
  }
});
getWorker();
startCamera();
recalc();
validate();
</script>
